kind = "web"
previewPath = "/"
title = "Wave Park Occupancy"
version = "1.0.0"
id = "artifacts/wave-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21079

[services.development]
run = "pnpm --filter @workspace/wave-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wave-dashboard", "run", "build" ]
publicDir = "artifacts/wave-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21079"
BASE_PATH = "/"
